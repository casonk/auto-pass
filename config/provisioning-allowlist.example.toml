# Per-repo credential access allowlist for the auto-pass provisioning daemon.
# Copy to provisioning-allowlist.local.toml and edit for your environment.
#
# Each [repos.<name>] block names a downstream git repository.
# <name> must match the last component of the origin remote URL (without .git),
# e.g. "nordility" for github.com/your-account/nordility.
#
# allowed_paths is a list of KeePassXC entry path globs (fnmatch syntax).
# The daemon denies all requests from repos not listed here, and denies any
# path that does not match at least one allowed_paths pattern.
#
# Run `auto-pass daemon-status` to verify the daemon is running and unlocked.
# Run `auto-pass serve --allowlist config/provisioning-allowlist.local.toml` to start.

# Administrative context exposes the in-memory master database password and is
# intentionally separate from entry-level read/write access. List only the
# repository that runs Auto Pass's trusted administrative UI and commands.
# Missing or invalid configuration grants no admin access.
admin_repos = ["auto-pass"]

[repos.nordility]
# VPN credentials used by nordility when selecting a server.
allowed_paths = [
  "your-vault/vpn-service",
]

[repos.shock-relay]
# Messaging service credentials for outbound notifications.
allowed_paths = [
  "your-vault/email-service",
  "your-vault/messaging-service",
  "your-vault/messaging-signal",
]

[repos.snowbridge]
# SMB share credentials for private file access.
allowed_paths = [
  "your-vault/smb-*",
]

[repos.intake]
# Application-layer credentials used by the intake service.
allowed_paths = [
  "your-vault/intake-*",
]

[repos.pin-service.vaults.master]
# Read access and write access are granted separately. `writable_paths` lets the repo replace
# the password of an entry that already exists (the daemon's `set` operation); it never creates
# an entry and does not imply read access, so list a path under both to allow both.
allowed_paths = [
  "your-vault/pin/*",
]
writable_paths = [
  "your-vault/pin/*",
]
